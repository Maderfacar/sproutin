# ============================================================
# Sproutin — Render Blueprint（後端部署，ADR-006 / AQ-1 決策）
#
# 由 Blueprint 統一建立整個 Render Backend Environment：
#   sproutin-api（NestJS web service）
#   sproutin-worker（BullMQ background worker）
#   sproutin-redis（Key Value / Redis 相容）
#   sproutin-db（PostgreSQL）
# 全部 region = Singapore。
#
# Human Owner 將刪除先前手動建立、且無資料的 Postgres / Key Value，之後不再手動建立，
# 一律由本檔統一管理。
#
# 連線：api / worker 透過 fromDatabase / fromService 於部署時自動取得
#   DATABASE_URL（Postgres connectionString）與 REDIS_URL（Key Value connectionString）。
#   皆為 server-only env，不會暴露給 client。
#
# 架構不變（Modular Monolith + Web/API/Worker/Redis/PostgreSQL）。
#
# ⚠ plan / region 名稱與費率會隨 Render 調整，Apply 前於 dashboard 確認：
#   - Postgres / Key Value free 方案為 test/dev（可能有容量/期限限制）
#   - background worker 需付費方案
# ============================================================

services:
  # ---------- 後端 API（NestJS，web service）----------
  - type: web
    name: sproutin-api
    runtime: docker
    dockerfilePath: ops/deploy/Dockerfile.api
    dockerContext: .
    plan: starter
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SCHOOL_SLUG
        value: dev
      - key: DATABASE_URL # server-only；Blueprint 自動注入 Postgres 連線字串
        fromDatabase:
          name: sproutin-db
          property: connectionString
      - key: REDIS_URL # server-only；Blueprint 自動注入 Key Value 連線字串
        fromService:
          type: keyvalue
          name: sproutin-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Render 自動產生，不落地 repo
      # LINE 相關（Phase 6 再填；先留白，由 Render 後台設定）
      - key: LINE_CHANNEL_ID
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LIFF_ID
        sync: false

  # ---------- 背景 Worker（BullMQ，background worker）----------
  - type: worker
    name: sproutin-worker
    runtime: docker
    dockerfilePath: ops/deploy/Dockerfile.api
    dockerContext: .
    dockerCommand: pnpm --filter @sproutin/api start:worker
    plan: starter # background worker 需付費方案
    region: singapore
    branch: main
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL # server-only
        fromDatabase:
          name: sproutin-db
          property: connectionString
      - key: REDIS_URL # server-only
        fromService:
          type: keyvalue
          name: sproutin-redis
          property: connectionString

  # ---------- Redis（Render Key Value，Redis 相容）----------
  - type: keyvalue
    name: sproutin-redis
    plan: free
    region: singapore
    ipAllowList: [] # 只允許 Render 內部連線（不對公網開放）
    maxmemoryPolicy: noeviction # BullMQ 相容性要求（不可淘汰 key）

# ---------- PostgreSQL（Blueprint 建立；test/dev）----------
databases:
  - name: sproutin-db
    plan: free # test/dev（正式 DB-per-School 於後續 Provisioning 逐校建立）
    region: singapore
