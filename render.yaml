# ============================================================
# Sproutin — Render Blueprint（後端部署，ADR-006 / AQ-1 決策）
#
# 由 Blueprint 統一建立整個 Render Backend Environment：
#   sproutin-api（NestJS web service）
#   sproutin-worker（BullMQ background worker）
#   sproutin-redis（Key Value / Redis 相容）
#   sproutin-db（PostgreSQL）
# 全部 region = Singapore。
#
# Human Owner 將刪除先前手動建立、且無資料的 Postgres / Key Value，之後不再手動建立，
# 一律由本檔統一管理。
#
# 連線：api / worker 透過 fromDatabase / fromService 於部署時自動取得
#   DATABASE_URL（Postgres connectionString）與 REDIS_URL（Key Value connectionString）。
#   皆為 server-only env，不會暴露給 client。
#
# 架構不變（Modular Monolith + Web/API/Worker/Redis/PostgreSQL）。
#
# ⚠ plan / region 名稱與費率會隨 Render 調整，Apply 前於 dashboard 確認：
#   - Postgres / Key Value free 方案為 test/dev（可能有容量/期限限制）
#   - background worker 需付費方案
# ============================================================

services:
  # ---------- 後端 API（NestJS，web service）----------
  - type: web
    name: sproutin-api
    runtime: docker
    dockerfilePath: ops/deploy/Dockerfile.api
    dockerContext: .
    plan: starter
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    # 每次部署「前」自動套用 DB migration（ADR-003）。
    # 僅 api 跑（單一入口、Prisma 自帶 advisory lock，避免與 worker 競態）。
    # migrate deploy 只套用已存在的 migration 檔（不會產生新 migration），Expand-only 安全。
    preDeployCommand: pnpm --filter @sproutin/db migrate:deploy
    envVars:
      - key: NODE_ENV
        value: production
      - key: SCHOOL_SLUG
        value: dev
      - key: DATABASE_URL # server-only；Blueprint 自動注入 Postgres 連線字串
        fromDatabase:
          name: sproutin-db
          property: connectionString
      - key: REDIS_URL # server-only；Blueprint 自動注入 Key Value 連線字串
        fromService:
          type: keyvalue
          name: sproutin-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Render 自動產生，不落地 repo
      # --- LINE Login（Step 2 登入）---
      # Channel ID 為公開識別碼（已內含於公開 LIFF URL），非機密 → plain value 自動套用。
      - key: LINE_LOGIN_CHANNEL_ID
        value: "2011106015"
      # --- LINE Messaging API / OA（Phase 7 推播；Step 2 用不到）---
      - key: LINE_MESSAGING_CHANNEL_ID
        value: "2011106146"
      - key: LINE_MESSAGING_CHANNEL_SECRET
        sync: false # Human Owner 於 Render 後台填（Phase 7）
      - key: LINE_MESSAGING_CHANNEL_ACCESS_TOKEN
        sync: false # Human Owner 於 Render 後台填（Phase 7）
      # LIFF_ID 改由 SchoolConfig → /config/public 提供（ADR-001），不再走 env。

  # ---------- 背景 Worker（BullMQ，background worker）----------
  - type: worker
    name: sproutin-worker
    runtime: docker
    dockerfilePath: ops/deploy/Dockerfile.api
    dockerContext: .
    dockerCommand: pnpm --filter @sproutin/api start:worker
    plan: starter # background worker 需付費方案
    region: singapore
    branch: main
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL # server-only
        fromDatabase:
          name: sproutin-db
          property: connectionString
      - key: REDIS_URL # server-only
        fromService:
          type: keyvalue
          name: sproutin-redis
          property: connectionString
      # --- LINE Messaging API（Step 5 推播）---
      # Worker 呼叫 LINE push API 需要 access token。未設定 → 自動略過推播（不影響站內通知）。
      - key: LINE_MESSAGING_CHANNEL_ACCESS_TOKEN
        sync: false # Human Owner 於 Render 後台填（Phase 7 Step 5）

  # ---------- Redis（Render Key Value，Redis 相容）----------
  # ⚠ TEST/DEV ONLY：plan=free 僅供測試/開發，**不代表 Production configuration**。
  #   正式環境請改用付費/持久化方案（容量、持久性、HA 依需求評估）。
  - type: keyvalue
    name: sproutin-redis
    plan: free # TEST/DEV ONLY — 非 production 設定
    region: singapore
    ipAllowList: [] # 只允許 Render 內部連線（不對公網開放）
    maxmemoryPolicy: noeviction # BullMQ 相容性要求（不可淘汰 key）

# ---------- PostgreSQL（Blueprint 建立）----------
# ⚠ TEST/DEV ONLY：plan=free 僅供測試/開發，**不代表 Production configuration**。
#   free Postgres 有容量/期限限制；正式環境與 DB-per-School 於後續 Provisioning 另行規劃。
databases:
  - name: sproutin-db
    plan: free # TEST/DEV ONLY — 非 production 設定
    region: singapore
