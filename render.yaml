# ============================================================
# Sproutin — Render Blueprint（後端部署，ADR-006 / AQ-1 決策）
#
# ⚠ 重要（既有資源引用）：
#   Human Owner 已「手動」在 Render 建立 PostgreSQL 與 Key Value。
#   因此本 Blueprint **只宣告 API 與 Worker**，**不宣告 databases / keyvalue**，
#   以免 Apply 時再建立第二套資源。
#
#   DATABASE_URL / REDIS_URL 透過 Environment Group「sproutin-backend」提供，
#   值為 sync:false（不寫入 repo）。Apply 後由 Human Owner 於 Render 後台，將
#   **既有** Postgres / Key Value 的「Internal 連線字串」貼入該群組一次，api+worker 共用。
#
#   Render 的 fromDatabase / fromService 只能引用「同一 Blueprint 內」宣告的資源，
#   無法安全引用 Blueprint 外手動建立的資源；故採 Environment Group 方式。
#
# ⚠ Region：api / worker 的 region 必須與你既有 Postgres / Key Value **相同**，
#   否則 Internal 連線不通。若你的資源不在 singapore，請改下方 region。
#
# ⚠ Key Value（BullMQ 相容）：請於 Render 後台將你既有 Key Value 的
#   maxmemory-policy 設為 **noeviction**（本 Blueprint 不再管理該設定）。
#
# 架構不變（Modular Monolith + Web/API/Worker/Redis/PostgreSQL）。
# ============================================================

services:
  # ---------- 後端 API（NestJS，web service）----------
  - type: web
    name: sproutin-api
    runtime: docker
    dockerfilePath: ops/deploy/Dockerfile.api
    dockerContext: .
    plan: starter
    region: singapore # ⚠ 必須與既有 Postgres / Key Value 同 region
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - fromGroup: sproutin-backend # DATABASE_URL, REDIS_URL（指向既有資源）
      - key: NODE_ENV
        value: production
      - key: SCHOOL_SLUG
        value: dev
      - key: JWT_SECRET
        generateValue: true # Render 自動產生，不落地 repo
      # LINE 相關（Phase 6 再填；先留白，由 Render 後台設定）
      - key: LINE_CHANNEL_ID
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LIFF_ID
        sync: false

  # ---------- 背景 Worker（BullMQ，background worker）----------
  - type: worker
    name: sproutin-worker
    runtime: docker
    dockerfilePath: ops/deploy/Dockerfile.api
    dockerContext: .
    dockerCommand: pnpm --filter @sproutin/api start:worker
    plan: starter # background worker 需付費方案
    region: singapore # ⚠ 必須與既有資源同 region
    branch: main
    autoDeploy: true
    envVars:
      - fromGroup: sproutin-backend # DATABASE_URL, REDIS_URL（指向既有資源）
      - key: NODE_ENV
        value: production

# ---------- Environment Group：指向「既有」資源，不建立新資源 ----------
# Apply 後於 Render 後台將值填入（既有資源的 Internal 連線字串）。
envVarGroups:
  - name: sproutin-backend
    envVars:
      - key: DATABASE_URL
        sync: false # 貼入「既有 PostgreSQL」的 Internal Database URL
      - key: REDIS_URL
        sync: false # 貼入「既有 Key Value」的 Internal URL（redis://...）
# 註：本 Blueprint 刻意「不」宣告 databases: / keyvalue:，避免重複建立既有資源。
