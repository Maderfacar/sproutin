name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本由 package.json 的 "packageManager" 決定，不在此重複指定
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Prisma client 生成（typecheck / build 需要）
      - run: pnpm db:generate

      # ESLint flat config（Phase 8）：lint gate。api / web / shared。
      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

  # ----------------------------------------------------------------
  # DB job（Phase 6 / Step 1）：於拋棄式 Postgres 驗證 migration + seed。
  # 證明：① migration 可套用 ② seed 可重入 ③ 資料圖符合 RBAC / ADR-002
  #       ④ migration 與 schema 無漂移（drift）。全程無需 localhost。
  # ----------------------------------------------------------------
  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sproutin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sproutin_test?schema=public
      SEED_DEMO: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:generate

      # ① 套用 baseline migration（migrate deploy = 只套用既有 migration 檔）
      - name: Apply migrations
        run: pnpm --filter @sproutin/db migrate:deploy

      # ② 灌入 synthetic demo seed（idempotent；此處同時測「重跑不重複」）
      - name: Seed demo data (run twice for idempotency)
        run: |
          pnpm db:seed
          pnpm db:seed

      # ③ 資料圖語意斷言（家長只見自己小孩 / 老師只見自班 / ADR-002 override）
      - name: Verify seed graph
        run: pnpm db:verify

      # ④ Drift 檢查：套用後的實際 DB（datasource url introspection）
      #    必須與 schema.prisma 的 datamodel 完全一致（有差異則 exit 2）
      - name: Migration drift check
        run: >-
          pnpm --filter @sproutin/db exec prisma migrate diff
          --from-schema-datasource prisma/schema.prisma
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

  # ----------------------------------------------------------------
  # docker-build job（Phase 7 / Step 3）：以真實 Docker build 把關。
  # 動機：Docker build context 只 COPY 部分檔案，與 CI（完整 repo + turbo）分歧的錯誤
  #       會逃過 build job，只在 Render 才爆（前例：漏 COPY tsconfig.base.json → 失去 strict
  #       → zod z.infer TS2345）。此 job 用同一 Dockerfile 在 CI 建置，讓分歧提早紅燈。
  #       只 build（不 push image、不部署）。api 與 worker 共用同一 image。
  # ----------------------------------------------------------------
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API/Worker image (same Dockerfile, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/deploy/Dockerfile.api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
