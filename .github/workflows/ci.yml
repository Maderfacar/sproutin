name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本由 package.json 的 "packageManager" 決定，不在此重複指定
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Prisma client 生成（typecheck / build 需要）
      - run: pnpm db:generate

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # TODO(next step): 加入 pnpm lint（待 ESLint flat config 建置後）
